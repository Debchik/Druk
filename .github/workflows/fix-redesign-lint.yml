name: Fix redesigned frontend lint
on:
  push:
    branches: [internal-platform]
    paths:
      - '.github/workflows/fix-redesign-lint.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-platform
          fetch-depth: 0
      - name: Fix hook-like callback name
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          s = p.read_text()
          old = 'useInProgram'
          new = 'addToProgram'
          if old not in s:
              raise SystemExit('expected callback name not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/fix-redesign-lint.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix redesigned frontend lint error'
          git push origin HEAD:internal-platform
