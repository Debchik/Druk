name: Apply topbar features

on:
  push:
    branches: [internal-platform]
    paths:
      - 'scripts/apply_topbar_features.py'
      - '.github/workflows/apply-topbar-features.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-platform
      - name: Apply Bug Report, theme and attention center UI
        run: python scripts/apply_topbar_features.py
      - name: Commit UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/styles.css
          git diff --cached --quiet || git commit -m 'Add Bug Report, dark theme and attention center'
          git push origin internal-platform
