name: Apply UI repairs

on:
  push:
    branches: [internal-platform]
    paths:
      - '.github/workflows/apply-ui-fixes-sep12.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-platform
      - name: Repair dashboard, sidebar and task board
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.tsx')
          text = app.read_text()

          # Use the wide generated landscape in the sidebar; its left/middle crop contains no Druk.
          text = text.replace("asset('rail.webp')", "asset('hero-home.webp')")

          # Render the dashboard artwork as an actual image rather than a CSS-only background.
          old_hero = '''<div className="hero-visual" style={{backgroundImage:`url(${asset('hero-home.webp')})`}}/>'''
          new_hero = '''<div className="hero-visual"><img src={asset('hero-home.webp')} alt=""/></div>'''
          if old_hero in text:
              text = text.replace(old_hero, new_hero, 1)

          start = text.index('function TasksPage(){')
          end = text.index('function ProgramsPage(){')
          block = r'''function TasksPage(){
 const qc=useQueryClient();const [mine,setMine]=useState(false),[showDone,setShowDone]=useState(false),[view,setView]=useState<'list'|'board'>('list'),[title,setTitle]=useState(''),[description,setDescription]=useState(''),[assignee,setAssignee]=useState(''),[due,setDue]=useState(''),[selected,setSelected]=useState<Task|null>(null)
 const q=useQuery<any>({queryKey:['tasks-rich',mine,showDone],queryFn:async()=>{const [tasks,members,issues]=await Promise.all([api(`/tasks?mine=${mine}&include_done=${showDone}`),api('/team'),api('/github/issues')]);return {tasks,members,issues}}})
 const add=useMutation({mutationFn:()=>api('/tasks',json('POST',{title,description:description||null,assignee_id:assignee||null,due_date:due||null,planned_week:weekStart()})),onSuccess:()=>{setTitle('');setDescription('');setDue('');void qc.invalidateQueries({queryKey:['tasks-rich']})}})
 const patch=useMutation({
  mutationFn:({id,data}:{id:string;data:any})=>api(`/tasks/${id}`,json('PATCH',data)),
  onMutate:async({id,data})=>{await qc.cancelQueries({queryKey:['tasks-rich']});const prev=qc.getQueriesData({queryKey:['tasks-rich']});qc.setQueriesData({queryKey:['tasks-rich']},(old:any)=>old?{...old,tasks:(old.tasks||[]).map((t:Task)=>t.id===id?{...t,...data}:t)}:old);setSelected(s=>s?.id===id?{...s,...data}:s);return {prev}},
  onError:(_e,_v,ctx)=>ctx?.prev.forEach(([key,data])=>qc.setQueryData(key,data)),
  onSuccess:(updated:any)=>setSelected(s=>s?.id===updated?.id?updated:s),
  onSettled:()=>void qc.invalidateQueries({queryKey:['tasks-rich']})
 })
 const remove=useMutation({mutationFn:(id:string)=>api(`/tasks/${id}`,{method:'DELETE'}),onSuccess:()=>{setSelected(null);void qc.invalidateQueries({queryKey:['tasks-rich']})}})
 if(q.isLoading)return <Loading/>;if(q.error)return <ErrorBox error={q.error}/>;const {tasks,members,issues}=q.data
 const moveTask=(id:string,status:Task['status'])=>{const task=(tasks as Task[]).find((t:Task)=>t.id===id);if(task&&task.status!==status)patch.mutate({id,data:{status}})}
 return <><PageTitle title="Задачи" subtitle="Превращаем идеи в реальные результаты." action={<Button onClick={()=>document.getElementById('task-title')?.focus()}><Icon name="plus"/>Новая задача</Button>}/><div className="toolbar"><button className={!mine?'active':''} onClick={()=>setMine(false)}>Все</button><button className={mine?'active':''} onClick={()=>setMine(true)}>Мои</button><button onClick={()=>setShowDone(!showDone)}>{showDone?'Скрыть готовые':'Показывать готовые'}</button><span/><div className="view-toggle"><button className={view==='list'?'active':''} onClick={()=>setView('list')}>☷ Список</button><button className={view==='board'?'active':''} onClick={()=>setView('board')}>▥ Доска</button></div></div><div className="tasks-layout"><div><Card title={<>Задачи <span className="count">{tasks.length+issues.length}</span></>} className="task-list-card">{view==='list'?<div className="task-table"><div className="task-row table-head"><span/><span>Задача</span><span>Исполнитель</span><span>Статус</span><span>Срок</span><span>Неделя</span><span/></div>{tasks.map((t:Task)=><div className="task-row" key={t.id}><input type="checkbox" checked={t.status==='done'} onChange={()=>patch.mutate({id:t.id,data:{status:t.status==='done'?'in_progress':'done'}})}/><div className="task-title-cell"><span className="doc-dot">▤</span><b>{t.title}</b>{t.description&&<small>{t.description}</small>}</div><MemberCell id={t.assignee_id} members={members}/><select className={`status-select ${t.status}`} value={t.status} onChange={e=>patch.mutate({id:t.id,data:{status:e.target.value}})}><option value="planned">Запланировано</option><option value="in_progress">В работе</option><option value="done">Готово</option></select><span>{ruDate(t.due_date)}</span><span>{t.planned_week?`Нед. ${weekNum(t.planned_week)}`:'—'}</span><button className="task-edit-link" onClick={()=>setSelected(t)}><Icon name="edit"/>Редактировать</button></div>)}{issues.map((g:GithubIssue)=><a className="task-row github-row" key={g.id} href={g.url} target="_blank" rel="noreferrer"><span className="github-mark">●</span><div className="task-title-cell"><b>GitHub #{g.number}</b><small>{g.title}</small></div><span>{g.assignee||'—'}</span><Chip tone={g.state==='open'?'green':'purple'}>{g.state==='open'?'Open':'Closed'}</Chip><span>—</span><span>GitHub</span><span>↗</span></a>)}</div>:<><div className="board-hint">Перетягивайте карточки между колонками. Статус сохраняется автоматически; подробности открываются по кнопке «Редактировать».</div><TaskBoard tasks={tasks} members={members} onMove={moveTask} onEdit={setSelected}/></>}</Card>{view==='list'&&<Card title="Доска задач" action={<button className="text-button" onClick={()=>setView('board')}>Развернуть доску →</button>}><div className="board-hint compact">Карточки здесь тоже можно перетягивать между статусами.</div><TaskBoard tasks={tasks} members={members} preview onMove={moveTask} onEdit={setSelected}/></Card>}</div><aside className="right-column"><Card title="Быстрое создание"><form className="stack-form" onSubmit={e=>{e.preventDefault();if(title.trim())add.mutate()}}><label>Название задачи<input id="task-title" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Например: Подготовить презентацию..."/></label><label>Описание (необязательно)<textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="Краткое описание задачи..." rows={3}/></label><div className="form-two"><label>Исполнитель<select value={assignee} onChange={e=>setAssignee(e.target.value)}><option value="">Не назначен</option>{members.map((m:Member)=><option key={m.user_id} value={m.user_id}>{m.display_name}</option>)}</select></label><label>Срок<input type="date" value={due} onChange={e=>setDue(e.target.value)}/></label></div><Button disabled={!title.trim()||add.isPending}>Создать задачу</Button></form></Card><Card title={<>Заблокированные <span className="red-count">{tasks.filter((x:Task)=>x.blocked).length}</span></>}>{tasks.filter((x:Task)=>x.blocked).slice(0,3).map((t:Task)=><button className="blocked-card blocked-button" key={t.id} onClick={()=>setSelected(t)}><b>{t.title}</b><small>{t.block_reason||'Нужна помощь команды.'}</small></button>)}{!tasks.some((x:Task)=>x.blocked)&&<Empty>Нет заблокированных задач.</Empty>}</Card><NatureNote text="Нет преград для больших идей"/></aside></div>{selected&&<TaskModal key={selected.id} task={selected} members={members} saving={patch.isPending} onClose={()=>setSelected(null)} onSave={data=>patch.mutate({id:selected.id,data})} onDelete={()=>{if(confirm('Удалить задачу?'))remove.mutate(selected.id)}}/>}</>
}
function MemberCell({id,members}:{id?:string|null;members:Member[]}){const m=members.find(x=>x.user_id===id);return m?<span className="member-cell"><Avatar name={m.display_name}/>{m.display_name}</span>:<span className="muted">Не назначен</span>}
function TaskBoard({tasks,members,preview,onMove,onEdit}:{tasks:Task[];members:Member[];preview?:boolean;onMove?:(id:string,status:Task['status'])=>void;onEdit?:(task:Task)=>void}){const [dragging,setDragging]=useState<string|null>(null),[over,setOver]=useState<Task['status']|null>(null);return <div className={cx('board',preview&&'preview')}>{(['planned','in_progress','done'] as const).map(s=><div className={cx('board-col',over===s&&dragging&&'drop-over')} key={s} onDragEnter={e=>{if(!onMove)return;e.preventDefault();setOver(s)}} onDragOver={e=>{if(!onMove)return;e.preventDefault();e.dataTransfer.dropEffect='move';setOver(s)}} onDragLeave={e=>{if(!e.currentTarget.contains(e.relatedTarget as Node))setOver(null)}} onDrop={e=>{if(!onMove)return;e.preventDefault();const id=e.dataTransfer.getData('text/task-id')||e.dataTransfer.getData('text/plain')||dragging;if(id)onMove(id,s);setDragging(null);setOver(null)}}><h3>{statusName[s]} <span>{tasks.filter(t=>t.status===s).length}</span></h3>{tasks.filter(t=>t.status===s).slice(0,preview?8:50).map(t=><article className={cx('board-card',dragging===t.id&&'dragging')} key={t.id} draggable={Boolean(onMove)} onDragStart={e=>{setDragging(t.id);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/task-id',t.id);e.dataTransfer.setData('text/plain',t.id)}} onDragEnd={()=>{setDragging(null);setOver(null)}}><div className="board-card-head"><span className="drag-handle" title="Перетащить">⋮⋮</span><b>{t.title}</b></div>{t.description&&<p>{t.description}</p>}<div className="board-card-meta"><span>{t.assignee_id&&<MemberCell id={t.assignee_id} members={members}/>}<small>{t.due_date&&ruDate(t.due_date)}</small></span><button className="board-edit-btn" draggable={false} onMouseDown={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();onEdit?.(t)}}><Icon name="edit"/>Редактировать</button></div>{t.blocked&&<span className="board-blocked">! Заблокирована</span>}</article>)}{!preview&&<button onClick={()=>document.getElementById('task-title')?.focus()}>＋ Добавить задачу</button>}</div>)}</div>}
function TaskModal({task,members,saving,onClose,onSave,onDelete}:{task:Task;members:Member[];saving:boolean;onClose:()=>void;onSave:(data:any)=>void;onDelete:()=>void}){const [form,setForm]=useState({...task,description:task.description||'',assignee_id:task.assignee_id||'',due_date:task.due_date||'',planned_week:task.planned_week||'',block_reason:task.block_reason||''});useEffect(()=>{const key=(e:KeyboardEvent)=>e.key==='Escape'&&onClose();document.addEventListener('keydown',key);return()=>document.removeEventListener('keydown',key)},[onClose]);function submit(e:FormEvent){e.preventDefault();onSave({title:form.title,description:form.description||null,assignee_id:form.assignee_id||null,status:form.status,due_date:form.due_date||null,planned_week:form.planned_week||null,blocked:form.blocked,block_reason:form.blocked?(form.block_reason||null):null})}return <div className="task-modal-backdrop" onMouseDown={onClose}><section className="task-modal" onMouseDown={e=>e.stopPropagation()}><header><div><span className="overline green">ЗАДАЧА</span><h2>{form.title}</h2></div><button className="modal-close" onClick={onClose}>×</button></header><form onSubmit={submit}><label className="task-title-edit">Название<input value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></label><label>Описание<textarea rows={5} value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Что необходимо сделать, контекст, ожидаемый результат..."/></label><div className="task-modal-grid"><label>Статус<select value={form.status} onChange={e=>setForm({...form,status:e.target.value as Task['status']})}><option value="planned">Запланировано</option><option value="in_progress">В работе</option><option value="done">Готово</option></select></label><label>Исполнитель<select value={form.assignee_id} onChange={e=>setForm({...form,assignee_id:e.target.value})}><option value="">Не назначен</option>{members.map(m=><option key={m.user_id} value={m.user_id}>{m.display_name}</option>)}</select></label><label>Срок<input type="date" value={form.due_date} onChange={e=>setForm({...form,due_date:e.target.value})}/></label><label>Неделя<input type="date" value={form.planned_week} onChange={e=>setForm({...form,planned_week:e.target.value})}/></label></div><label className="blocked-toggle"><input type="checkbox" checked={form.blocked} onChange={e=>setForm({...form,blocked:e.target.checked})}/><span><b>Задача заблокирована</b><small>Отметьте, если для продолжения нужна помощь или внешняя зависимость.</small></span></label>{form.blocked&&<label>Причина блокировки<textarea rows={2} value={form.block_reason} onChange={e=>setForm({...form,block_reason:e.target.value})} placeholder="Что мешает двигаться дальше?"/></label>}<footer><Button type="button" kind="danger" onClick={onDelete}>Удалить</Button><span/><Button type="button" kind="secondary" onClick={onClose}>Закрыть</Button><Button disabled={!form.title.trim()||saving}>{saving?'Сохраняем…':'Сохранить изменения'}</Button></footer></form></section></div>}
function weekNum(d:string){const dt=new Date(d+'T12:00:00'),onejan=new Date(dt.getFullYear(),0,1);return Math.ceil((((dt.getTime()-onejan.getTime())/86400000)+onejan.getDay()+1)/7)}
'''
          text = text[:start] + block + '\n\n' + text[end:]
          app.write_text(text)

          css = Path('frontend/src/styles.css')
          s = css.read_text()
          marker = '/* ui-fixes-sep12-v3 */'
          extra = r'''
/* ui-fixes-sep12-v3 */
/* Generated artwork: robust dashboard hero + scenery-only sidebar crop. */
.hero-visual{position:relative;min-height:100%;overflow:hidden;background:#f3f5e9}.hero-visual img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}.sidebar-art{background-position:24% center!important;background-size:auto 100%!important}.sidebar-art:after{background:linear-gradient(180deg,#fff 0,rgba(255,255,255,.72) 8%,rgba(255,255,255,.08) 28%,rgba(255,255,255,0) 54%)!important}

/* Task page: remove the squeezed/overlapping layout at medium desktop widths. */
.task-table{overflow:visible}.task-row{grid-template-columns:24px minmax(180px,1.7fr) minmax(95px,.72fr) minmax(112px,.72fr) 92px 72px 104px;min-width:0;gap:9px}.task-row.table-head{grid-template-columns:24px minmax(180px,1.7fr) minmax(95px,.72fr) minmax(112px,.72fr) 92px 72px 104px}.task-edit-link{border:1px solid #dde5da;background:#fff;color:#417436;border-radius:8px;padding:6px 7px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:650;white-space:nowrap}.task-edit-link:hover{background:#f2f7ef}.task-edit-link .ico{font-size:10px}.board-hint.compact{margin-bottom:10px}.board{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;overflow:visible}.board-col{min-width:0;min-height:210px;padding:11px}.board-col.drop-over{background:#e4f0dd!important;border-color:#77a467!important;box-shadow:inset 0 0 0 2px rgba(64,123,45,.10)}.board-card{padding:10px;cursor:grab;user-select:none;touch-action:manipulation}.board-card:active{cursor:grabbing}.board-card-head{display:grid!important;grid-template-columns:18px minmax(0,1fr);align-items:start;gap:5px;margin:0!important}.board-card-head b{font-size:10.5px;line-height:1.35}.drag-handle{font-size:14px;color:#a1aaa0;line-height:1;letter-spacing:-4px;cursor:grab}.board-card-meta{display:flex!important;align-items:center;justify-content:space-between;gap:7px;margin-top:9px!important}.board-card-meta>span{display:flex;min-width:0;align-items:center;gap:5px}.board-edit-btn{border:0;background:#edf5e9;color:#3e7533;border-radius:7px;padding:5px 7px;font-size:8.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}.board-edit-btn:hover{background:#e1eedb}.board-edit-btn .ico{font-size:9px}.board-card.dragging{opacity:.32;transform:scale(.985);box-shadow:none}

@media(max-width:1350px) and (min-width:961px){.tasks-layout{grid-template-columns:1fr!important}.tasks-layout>.right-column{position:static;grid-template-columns:repeat(2,minmax(0,1fr));top:auto}.task-row>*:nth-child(6){display:none}.task-row{grid-template-columns:24px minmax(200px,1.9fr) minmax(100px,.75fr) 120px 96px 104px}.task-row.table-head{grid-template-columns:24px minmax(200px,1.9fr) minmax(100px,.75fr) 120px 96px 104px}}
@media(max-width:960px){.task-table{overflow-x:auto}.task-row{min-width:720px}.tasks-layout>.right-column{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.tasks-layout>.right-column{grid-template-columns:1fr}.board{grid-template-columns:1fr}.task-row{min-width:650px}.hero-visual img{height:160px}}
'''
          if marker not in s:
              s += '\n' + extra
          css.write_text(s)
          PY
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/styles.css
          git diff --cached --quiet || git commit -m 'Repair dashboard artwork and Jira task interactions'
          git push origin internal-platform
