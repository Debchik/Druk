name: Apply UI repairs

on:
  push:
    branches: [internal-platform]
    paths:
      - '.github/workflows/apply-ui-fixes-sep12.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-platform
      - name: Apply dashboard, checklist and favicon repairs
        run: python scripts/fix_dashboard_checklist_favicon.py
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/styles.css frontend/index.html frontend/public/favicon.png
          git diff --cached --quiet || git commit -m 'Fix checklist, dashboard calendar, hero and favicon'
          git push origin internal-platform
