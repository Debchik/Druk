name: Deploy public landing + internal platform to Pages
on:
  workflow_dispatch:
  push:
    branches: [internal-platform]
    paths:
      - 'frontend/**'
      - '.github/workflows/platform-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/internal-platform'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://wjtdlwatvknsrenlelyh.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://druk-internal-api.onrender.com/api/v1' }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/internal/
    steps:
      - name: Checkout internal platform
        uses: actions/checkout@v7
      - name: Checkout public landing from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: public-landing
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Validate configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo 'VITE_SUPABASE_PUBLISHABLE_KEY must start with sb_publishable_' >&2; exit 1;; esac
          test -n "$VITE_API_URL"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Assemble Pages artifact
        run: |
          mkdir -p site/internal
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' public-landing/ site/
          cp -a frontend/dist/. site/internal/
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
