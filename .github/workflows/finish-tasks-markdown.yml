name: Finish task archive and markdown UX

on:
  push:
    branches: [internal-platform]
    paths:
      - '.github/workflows/finish-tasks-markdown.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/finish_tasks_markdown.py
      - name: Remove one-shot helpers
        run: rm -f scripts/finish_tasks_markdown.py .github/workflows/finish-tasks-markdown.yml scripts/apply_tasks_markdown_archive.py .github/workflows/apply-tasks-markdown-archive.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Polish task archive and Markdown answer editing'
          git push origin HEAD:internal-platform
