name: Apply task archive and markdown patch

on:
  push:
    branches: [internal-platform]
    paths:
      - 'scripts/apply_tasks_markdown_archive.py'
      - '.github/workflows/apply-tasks-markdown-archive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/apply_tasks_markdown_archive.py
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/lib/api.ts frontend/src/lib/prefetch.ts frontend/src/main.tsx frontend/src/stability.css backend/app/core.py backend/app/schemas.py
          git diff --cached --quiet && exit 0
          git commit -m 'Add task archive scroll and markdown answers'
          git push origin HEAD:internal-platform
