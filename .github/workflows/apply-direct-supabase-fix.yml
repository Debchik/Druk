name: Apply direct Supabase settings fix

on:
  push:
    branches: [internal-platform]
    paths: ['.github/workflows/apply-direct-supabase-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preserve partial project settings updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/lib/api.ts')
          s=p.read_text()
          old="""  if(p==='/settings'){if(method==='GET')return dataOf(await table('project_settings').select('*').eq('workspace_id',ws).maybeSingle());if(method==='PATCH')return oneOf(await table('project_settings').upsert({workspace_id:ws,project_name:b.project_name||'Друк',created_by:c.id,...b},{onConflict:'workspace_id'}).select().single())}"""
          new="""  if(p==='/settings'){
            if(method==='GET')return dataOf(await table('project_settings').select('*').eq('workspace_id',ws).maybeSingle())
            if(method==='PATCH'){
              const updated=await table('project_settings').update(b).eq('workspace_id',ws).select().maybeSingle()
              if(updated.error)asError(updated)
              if(updated.data)return updated.data
              return oneOf(await table('project_settings').insert({workspace_id:ws,project_name:b.project_name||'Друк',created_by:c.id,...b}).select().single())
            }
          }"""
          if old not in s:
              raise SystemExit('expected settings adapter block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/api.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix partial direct settings updates'
          git push origin HEAD:internal-platform
