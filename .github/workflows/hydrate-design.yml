name: Hydrate redesigned frontend
on:
  push:
    branches: [internal-platform]
    paths:
      - '.design-payload/**'
      - '.github/workflows/hydrate-design.yml'
permissions:
  contents: write
jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-platform
          fetch-depth: 0
      - name: Reconstruct redesigned source
        shell: bash
        run: |
          set -euo pipefail
          cat .design-payload/App.part.* > /tmp/App.tsx.gz
          gzip -dc /tmp/App.tsx.gz > frontend/src/App.tsx
          cat .design-payload/styles.part.* > /tmp/styles.css.gz
          gzip -dc /tmp/styles.css.gz > frontend/src/styles.css
          rm -rf .design-payload
          rm -f .github/workflows/hydrate-design.yml
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Implement redesigned internal platform UI'
          git push origin HEAD:internal-platform
