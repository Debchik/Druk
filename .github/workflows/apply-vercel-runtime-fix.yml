name: Apply Vercel runtime fixes

on:
  push:
    branches: [internal-platform]
    paths:
      - 'scripts/fix_vercel_runtime.py'
      - '.github/workflows/apply-vercel-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch runtime
        run: python scripts/fix_vercel_runtime.py
      - name: Remove one-shot patch files
        run: rm scripts/fix_vercel_runtime.py .github/workflows/apply-vercel-runtime-fix.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Vercel runtime regressions'
          git push origin HEAD:internal-platform
