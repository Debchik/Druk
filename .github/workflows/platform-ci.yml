name: Platform CI
on:
  push:
    branches: [internal-platform]
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/platform-ci.yml'
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-key-xxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q -m 'not integration'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key-xxxxxxxxxxxx
      VITE_API_URL: https://example.com/api/v1
      VITE_BASE_PATH: /Druk/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package.json }
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Commit generated lockfile and remove CI trigger
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git rm -f ../.github/CI_TRIGGER 2>/dev/null || true
            git commit -m 'Add frontend lockfile'
            git push origin HEAD:internal-platform
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
