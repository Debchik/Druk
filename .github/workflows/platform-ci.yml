name: Platform CI
on:
  push:
    branches: [internal-platform]
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/platform-ci.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q -m 'not integration'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_0123456789
      VITE_API_URL: https://example.com/api/v1
      VITE_BASE_PATH: /Druk/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
