name: Apply task history UI update

on:
  push:
    branches: [internal-platform]
    paths: ['.github/workflows/task-history-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-platform
      - name: Patch task history UI
        shell: python
        run: |
          from pathlib import Path

          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          old = "type Task={id:string;title:string;description?:string|null;assignee_id?:string|null;status:'planned'|'in_progress'|'done';due_date?:string|null;planned_week?:string|null;blocked:boolean;block_reason?:string|null;archived?:boolean;updated_at:string}"
          new = "type Task={id:string;title:string;description?:string|null;assignee_id?:string|null;status:'planned'|'in_progress'|'done';due_date?:string|null;planned_week?:string|null;blocked:boolean;block_reason?:string|null;archived?:boolean;archived_at?:string|null;updated_at:string}"
          assert old in text
          text = text.replace(old, new, 1)

          old = '''<div className="task-row table-head"><span/><span>Задача</span><span>Исполнитель</span><span>Статус</span><span>Срок</span><span>Неделя</span><span/></div>'''
          new = '''<div className="task-row table-head"><span/><span>Задача</span><span>Исполнитель</span><span>Статус</span><span>Срок</span><span>{archiveView?'Архивирована':'Неделя'}</span><span/></div>'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''<span>{t.planned_week?`Нед. ${weekNum(t.planned_week)}`:'—'}</span><button className="task-edit-link" onClick={()=>setSelected(t)}><Icon name="edit"/>Редактировать</button>'''
          new = '''<span>{archiveView?(t.archived_at?new Date(t.archived_at).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}):'—'):(t.planned_week?`Нед. ${weekNum(t.planned_week)}`:'—')}</span><span className="task-row-actions"><button className="task-edit-link" onClick={()=>setSelected(t)}><Icon name="edit"/>Редактировать</button>{archiveView?<button className="task-archive-link" onClick={()=>patch.mutate({id:t.id,data:{archived:false}})}>↩ Вернуть</button>:t.status==='done'?<button className="task-archive-link" onClick={()=>patch.mutate({id:t.id,data:{archived:true}})}>▣ В архив</button>:null}</span>'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''<header><div><span className="overline green">ЗАДАЧА</span><h2>{form.title}</h2></div><button className="modal-close" onClick={onClose}>×</button></header>'''
          new = '''<header><div><span className="overline green">ЗАДАЧА</span><h2>{form.title}</h2>{task.archived&&<small className="task-archive-meta">В архиве с {task.archived_at?new Date(task.archived_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):'—'}</small>}</div><button className="modal-close" onClick={onClose}>×</button></header>'''
          assert old in text
          text = text.replace(old, new, 1)
          app.write_text(text)

          css = Path('frontend/src/stability.css')
          styles = css.read_text()
          styles += '''\n/* task-history-scroll-v1 */\n.task-list-card .task-table{max-height:clamp(430px,64vh,720px);overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable both-edges}\n.board-col{max-height:clamp(430px,64vh,720px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}\n.task-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0}\n.task-archive-link{border:0;background:transparent;color:#657066;font-size:10px;font-weight:650;padding:4px 5px;white-space:nowrap}\n.task-archive-link:hover{color:#397b2b;background:#f2f7ef;border-radius:6px}\n.task-archive-meta{display:block;margin-top:4px;color:#7f887f;font-size:10px;font-weight:550}\n@media(max-width:900px){.task-list-card .task-table,.board-col{max-height:68vh}.task-row-actions{align-items:flex-end;flex-direction:column;gap:2px}}\n'''
          css.write_text(styles)

          migration = Path('supabase/migrations/009_task_archived_at.sql')
          migration.write_text('''alter table public.tasks\n  add column if not exists archived_at timestamptz;\n\nupdate public.tasks\nset archived_at = coalesce(archived_at, updated_at, created_at, now())\nwhere archived = true and archived_at is null;\n\ncreate or replace function public.set_task_archived_at()\nreturns trigger\nlanguage plpgsql\nset search_path = public\nas $$\nbegin\n  if new.archived = true and (tg_op = 'INSERT' or old.archived = false) then\n    new.archived_at = coalesce(new.archived_at, now());\n  elsif new.archived = false then\n    new.archived_at = null;\n  end if;\n  return new;\nend;\n$$;\n\ndrop trigger if exists tasks_set_archived_at on public.tasks;\ncreate trigger tasks_set_archived_at\nbefore insert or update of archived on public.tasks\nfor each row execute function public.set_task_archived_at();\n\ncreate index if not exists tasks_workspace_archived_at_idx\n  on public.tasks(workspace_id, archived, archived_at desc);\n''')

          Path('.github/workflows/task-history-once.yml').unlink()
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/stability.css supabase/migrations/009_task_archived_at.sql .github/workflows/task-history-once.yml
          git commit -m "feat: preserve task archive history"
          git push origin internal-platform
