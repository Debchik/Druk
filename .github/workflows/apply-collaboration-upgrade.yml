name: Apply collaboration upgrade

on:
  push:
    branches: [internal-platform]
    paths:
      - 'scripts/apply_collaboration_upgrade.py'
      - '.github/workflows/apply-collaboration-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-platform
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply source patches
        run: python scripts/apply_collaboration_upgrade.py
      - name: Commit upgraded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement responsive collaboration workflow"
          git push origin HEAD:internal-platform
