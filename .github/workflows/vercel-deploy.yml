name: Deploy internal platform to Vercel

on:
  workflow_dispatch:
  push:
    branches: [internal-platform]
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-deploy.yml'

permissions:
  contents: read

concurrency:
  group: vercel-internal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Vercel not configured yet
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo 'Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to enable deployment.'
      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        working-directory: frontend
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build for Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        working-directory: frontend
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        working-directory: frontend
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
