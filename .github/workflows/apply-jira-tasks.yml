name: Apply Jira-style task board

on:
  push:
    branches: [internal-platform]
    paths:
      - '.github/workflows/apply-jira-tasks.yml'
      - 'scripts/apply_jira_tasks.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-platform
      - name: Apply task board patch
        run: python scripts/apply_jira_tasks.py
      - name: Commit upgraded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/styles.css
          git diff --cached --quiet || git commit -m 'Add Jira-style draggable task board'
          git push origin internal-platform
