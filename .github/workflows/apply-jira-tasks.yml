name: Apply Jira-style task board

on:
  push:
    branches: [internal-platform]
    paths:
      - '.github/workflows/apply-jira-tasks.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-platform
      - name: Upgrade task UX
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          start = text.index('function TasksPage(){')
          end = text.index('function ProgramsPage(){')
          block = r'''function TasksPage(){
 const qc=useQueryClient();const [mine,setMine]=useState(false),[showDone,setShowDone]=useState(false),[view,setView]=useState<'list'|'board'>('list'),[title,setTitle]=useState(''),[description,setDescription]=useState(''),[assignee,setAssignee]=useState(''),[due,setDue]=useState(''),[selected,setSelected]=useState<Task|null>(null)
 const q=useQuery<any>({queryKey:['tasks-rich',mine,showDone],queryFn:async()=>{const [tasks,members,issues]=await Promise.all([api(`/tasks?mine=${mine}&include_done=${showDone}`),api('/team'),api('/github/issues')]);return {tasks,members,issues}}})
 const add=useMutation({mutationFn:()=>api('/tasks',json('POST',{title,description:description||null,assignee_id:assignee||null,due_date:due||null,planned_week:weekStart()})),onSuccess:()=>{setTitle('');setDescription('');setDue('');void qc.invalidateQueries({queryKey:['tasks-rich']})}})
 const patch=useMutation({
  mutationFn:({id,data}:{id:string;data:any})=>api(`/tasks/${id}`,json('PATCH',data)),
  onMutate:async({id,data})=>{await qc.cancelQueries({queryKey:['tasks-rich']});const prev=qc.getQueriesData({queryKey:['tasks-rich']});qc.setQueriesData({queryKey:['tasks-rich']},(old:any)=>old?{...old,tasks:(old.tasks||[]).map((t:Task)=>t.id===id?{...t,...data}:t)}:old);setSelected(s=>s?.id===id?{...s,...data}:s);return {prev}},
  onError:(_e,_v,ctx)=>ctx?.prev.forEach(([key,data])=>qc.setQueryData(key,data)),
  onSuccess:(updated:any)=>setSelected(s=>s?.id===updated?.id?updated:s),
  onSettled:()=>void qc.invalidateQueries({queryKey:['tasks-rich']})
 })
 const remove=useMutation({mutationFn:(id:string)=>api(`/tasks/${id}`,{method:'DELETE'}),onSuccess:()=>{setSelected(null);void qc.invalidateQueries({queryKey:['tasks-rich']})}})
 if(q.isLoading)return <Loading/>;if(q.error)return <ErrorBox error={q.error}/>;const {tasks,members,issues}=q.data
 const moveTask=(id:string,status:Task['status'])=>patch.mutate({id,data:{status}})
 return <><PageTitle title="Задачи" subtitle="Превращаем идеи в реальные результаты." action={<Button onClick={()=>document.getElementById('task-title')?.focus()}><Icon name="plus"/>Новая задача</Button>}/><div className="toolbar"><button className={!mine?'active':''} onClick={()=>setMine(false)}>Все</button><button className={mine?'active':''} onClick={()=>setMine(true)}>Мои</button><button onClick={()=>setShowDone(!showDone)}>{showDone?'Скрыть готовые':'Показывать готовые'}</button><span/><div className="view-toggle"><button className={view==='list'?'active':''} onClick={()=>setView('list')}>☷ Список</button><button className={view==='board'?'active':''} onClick={()=>setView('board')}>▥ Доска</button></div></div><div className="tasks-layout"><div><Card title={<>Задачи <span className="count">{tasks.length+issues.length}</span></>} className="task-list-card">{view==='list'?<div className="task-table"><div className="task-row table-head"><span>Задача</span><span>Исполнитель</span><span>Статус</span><span>Срок</span><span>Неделя</span><span/></div>{tasks.map((t:Task)=><div className="task-row task-row-clickable" key={t.id} onClick={()=>setSelected(t)}><input type="checkbox" checked={t.status==='done'} onClick={e=>e.stopPropagation()} onChange={()=>patch.mutate({id:t.id,data:{status:t.status==='done'?'in_progress':'done'}})}/><div className="task-title-cell"><span className="doc-dot">▤</span><b>{t.title}</b>{t.description&&<small>{t.description}</small>}</div><MemberCell id={t.assignee_id} members={members}/><select className={`status-select ${t.status}`} value={t.status} onClick={e=>e.stopPropagation()} onChange={e=>patch.mutate({id:t.id,data:{status:e.target.value}})}><option value="planned">Запланировано</option><option value="in_progress">В работе</option><option value="done">Готово</option></select><span>{ruDate(t.due_date)}</span><span>{t.planned_week?`Нед. ${weekNum(t.planned_week)}`:'—'}</span><button className="icon-btn" onClick={e=>{e.stopPropagation();setSelected(t)}}><Icon name="more"/></button></div>)}{issues.map((g:GithubIssue)=><a className="task-row github-row" key={g.id} href={g.url} target="_blank" rel="noreferrer"><span className="github-mark">●</span><div className="task-title-cell"><b>GitHub #{g.number}</b><small>{g.title}</small></div><span>{g.assignee||'—'}</span><Chip tone={g.state==='open'?'green':'purple'}>{g.state==='open'?'Open':'Closed'}</Chip><span>—</span><span>GitHub</span><span>↗</span></a>)}</div>:<><div className="board-hint">Перетягивайте карточки между колонками — статус сохранится автоматически.</div><TaskBoard tasks={tasks} members={members} onMove={moveTask} onOpen={setSelected}/></>}</Card>{view==='list'&&<Card title="Доска задач (превью)" action={<button className="text-button" onClick={()=>setView('board')}>Открыть доску →</button>}><TaskBoard tasks={tasks} members={members} preview onOpen={setSelected}/></Card>}</div><aside className="right-column"><Card title="Быстрое создание"><form className="stack-form" onSubmit={e=>{e.preventDefault();if(title.trim())add.mutate()}}><label>Название задачи<input id="task-title" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Например: Подготовить презентацию..."/></label><label>Описание (необязательно)<textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="Краткое описание задачи..." rows={3}/></label><div className="form-two"><label>Исполнитель<select value={assignee} onChange={e=>setAssignee(e.target.value)}><option value="">Не назначен</option>{members.map((m:Member)=><option key={m.user_id} value={m.user_id}>{m.display_name}</option>)}</select></label><label>Срок<input type="date" value={due} onChange={e=>setDue(e.target.value)}/></label></div><Button disabled={!title.trim()||add.isPending}>Создать задачу</Button></form></Card><Card title={<>Заблокированные <span className="red-count">{tasks.filter((x:Task)=>x.blocked).length}</span></>}>{tasks.filter((x:Task)=>x.blocked).slice(0,3).map((t:Task)=><button className="blocked-card blocked-button" key={t.id} onClick={()=>setSelected(t)}><b>{t.title}</b><small>{t.block_reason||'Нужна помощь команды.'}</small></button>)}{!tasks.some((x:Task)=>x.blocked)&&<Empty>Нет заблокированных задач.</Empty>}</Card><NatureNote text="Нет преград для больших идей"/></aside></div>{selected&&<TaskModal key={selected.id} task={selected} members={members} saving={patch.isPending} onClose={()=>setSelected(null)} onSave={data=>patch.mutate({id:selected.id,data})} onDelete={()=>{if(confirm('Удалить задачу?'))remove.mutate(selected.id)}}/>}</>
}
function MemberCell({id,members}:{id?:string|null;members:Member[]}){const m=members.find(x=>x.user_id===id);return m?<span className="member-cell"><Avatar name={m.display_name}/>{m.display_name}</span>:<span className="muted">Не назначен</span>}
function TaskBoard({tasks,members,preview,onMove,onOpen}:{tasks:Task[];members:Member[];preview?:boolean;onMove?:(id:string,status:Task['status'])=>void;onOpen?:(task:Task)=>void}){const [dragging,setDragging]=useState<string|null>(null),[over,setOver]=useState<Task['status']|null>(null);return <div className={cx('board',preview&&'preview')}>{(['planned','in_progress','done'] as const).map(s=><div className={cx('board-col',over===s&&dragging&&'drop-over')} key={s} onDragOver={e=>{if(preview||!onMove)return;e.preventDefault();e.dataTransfer.dropEffect='move';setOver(s)}} onDragLeave={e=>{if(!e.currentTarget.contains(e.relatedTarget as Node))setOver(null)}} onDrop={e=>{if(preview||!onMove)return;e.preventDefault();const id=e.dataTransfer.getData('text/task-id')||dragging;if(id)onMove(id,s);setDragging(null);setOver(null)}}><h3>{statusName[s]} <span>{tasks.filter(t=>t.status===s).length}</span></h3>{tasks.filter(t=>t.status===s).slice(0,preview?4:40).map(t=><div className={cx('board-card',dragging===t.id&&'dragging')} key={t.id} draggable={!preview&&Boolean(onMove)} onDragStart={e=>{setDragging(t.id);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/task-id',t.id)}} onDragEnd={()=>{setDragging(null);setOver(null)}} onClick={()=>onOpen?.(t)} role="button" tabIndex={0} onKeyDown={e=>{if(e.key==='Enter'||e.key===' ')onOpen?.(t)}}><b>{t.title}</b>{t.description&&<p>{t.description}</p>}<div>{t.assignee_id&&<MemberCell id={t.assignee_id} members={members}/>}<small>{t.due_date&&ruDate(t.due_date)}</small></div>{t.blocked&&<span className="board-blocked">! Заблокирована</span>}</div>)}{!preview&&<button onClick={()=>document.getElementById('task-title')?.focus()}>＋ Добавить задачу</button>}</div>)}</div>}
function TaskModal({task,members,saving,onClose,onSave,onDelete}:{task:Task;members:Member[];saving:boolean;onClose:()=>void;onSave:(data:any)=>void;onDelete:()=>void}){const [form,setForm]=useState({...task,description:task.description||'',assignee_id:task.assignee_id||'',due_date:task.due_date||'',planned_week:task.planned_week||'',block_reason:task.block_reason||''});useEffect(()=>{const key=(e:KeyboardEvent)=>e.key==='Escape'&&onClose();document.addEventListener('keydown',key);return()=>document.removeEventListener('keydown',key)},[onClose]);function submit(e:FormEvent){e.preventDefault();onSave({title:form.title,description:form.description||null,assignee_id:form.assignee_id||null,status:form.status,due_date:form.due_date||null,planned_week:form.planned_week||null,blocked:form.blocked,block_reason:form.blocked?(form.block_reason||null):null})}return <div className="task-modal-backdrop" onMouseDown={onClose}><section className="task-modal" onMouseDown={e=>e.stopPropagation()}><header><div><span className="overline green">ЗАДАЧА</span><h2>{form.title}</h2></div><button className="modal-close" onClick={onClose}>×</button></header><form onSubmit={submit}><label className="task-title-edit">Название<input value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></label><label>Описание<textarea rows={5} value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Что необходимо сделать, контекст, ожидаемый результат..."/></label><div className="task-modal-grid"><label>Статус<select value={form.status} onChange={e=>setForm({...form,status:e.target.value as Task['status']})}><option value="planned">Запланировано</option><option value="in_progress">В работе</option><option value="done">Готово</option></select></label><label>Исполнитель<select value={form.assignee_id} onChange={e=>setForm({...form,assignee_id:e.target.value})}><option value="">Не назначен</option>{members.map(m=><option key={m.user_id} value={m.user_id}>{m.display_name}</option>)}</select></label><label>Срок<input type="date" value={form.due_date} onChange={e=>setForm({...form,due_date:e.target.value})}/></label><label>Неделя<input type="date" value={form.planned_week} onChange={e=>setForm({...form,planned_week:e.target.value})}/></label></div><label className="blocked-toggle"><input type="checkbox" checked={form.blocked} onChange={e=>setForm({...form,blocked:e.target.checked})}/><span><b>Задача заблокирована</b><small>Отметьте, если для продолжения нужна помощь или внешняя зависимость.</small></span></label>{form.blocked&&<label>Причина блокировки<textarea rows={2} value={form.block_reason} onChange={e=>setForm({...form,block_reason:e.target.value})} placeholder="Что мешает двигаться дальше?"/></label>}<footer><Button type="button" kind="danger" onClick={onDelete}>Удалить</Button><span/><Button type="button" kind="secondary" onClick={onClose}>Закрыть</Button><Button disabled={!form.title.trim()||saving}>{saving?'Сохраняем…':'Сохранить изменения'}</Button></footer></form></section></div>}
function weekNum(d:string){const dt=new Date(d+'T12:00:00'),onejan=new Date(dt.getFullYear(),0,1);return Math.ceil((((dt.getTime()-onejan.getTime())/86400000)+onejan.getDay()+1)/7)}
'''
          app.write_text(text[:start] + block + '\n\n' + text[end:])

          css = Path('frontend/src/styles.css')
          s = css.read_text()
          extra = r'''
/* Jira-style task interaction */
.task-row-clickable{cursor:pointer;transition:background .15s ease}.task-row-clickable:hover{background:#f7faf5}.board-hint{font-size:11px;color:#6f786f;background:#f4f8f1;border:1px solid #e2eadf;border-radius:9px;padding:8px 10px;margin-bottom:9px}.board{grid-template-columns:repeat(3,minmax(250px,1fr));align-items:stretch}.board-col{transition:background .15s,border-color .15s,box-shadow .15s;border:1px solid transparent}.board-col.drop-over{background:#e6f2df;border-color:#8db77e;box-shadow:inset 0 0 0 2px rgba(63,124,43,.08)}.board-card{cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .12s;border-color:#e0e6dc}.board-card[draggable="true"]{cursor:grab}.board-card[draggable="true"]:active{cursor:grabbing}.board-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(34,55,29,.08)}.board-card.dragging{opacity:.38;transform:rotate(1deg) scale(.98)}.board-card>p{font-size:9.5px;line-height:1.35;color:#7b827d;margin:5px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.board-blocked{display:inline-flex;margin-top:7px;font-size:9px;color:#d54040;background:#fff0f0;border-radius:999px;padding:3px 7px}.blocked-button{width:100%;text-align:left;cursor:pointer}.task-modal-backdrop{position:fixed;inset:0;background:rgba(20,27,20,.34);backdrop-filter:blur(5px);display:grid;place-items:center;padding:22px;z-index:200}.task-modal{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 44px);overflow:auto;background:#fff;border:1px solid #dfe5dc;border-radius:18px;box-shadow:0 28px 90px rgba(20,35,18,.25);padding:20px}.task-modal>header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:13px;border-bottom:1px solid #edf0eb;margin-bottom:14px}.task-modal>header h2{font-size:24px;letter-spacing:-.035em;margin:7px 0 0}.modal-close{width:36px;height:36px;border:0;border-radius:10px;background:#f3f5f2;font-size:25px;line-height:1;color:#566057}.task-modal form{display:grid;gap:13px}.task-modal label{display:grid;gap:6px}.task-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.blocked-toggle{grid-template-columns:auto 1fr!important;align-items:flex-start;background:#f8faf7;border:1px solid #e4e9e1;border-radius:11px;padding:11px}.blocked-toggle input{width:17px;height:17px;margin-top:2px;accent-color:#4b8438}.blocked-toggle span{display:grid;gap:2px}.blocked-toggle b{font-size:11px}.blocked-toggle small{font-size:9.5px;color:#828983;font-weight:400}.task-modal footer{display:flex;gap:8px;align-items:center;padding-top:7px}.task-modal footer>span{flex:1}@media(max-width:700px){.board{grid-template-columns:1fr;overflow:visible}.task-modal-backdrop{padding:8px;align-items:end}.task-modal{width:100%;max-height:92vh;border-radius:18px 18px 8px 8px;padding:15px}.task-modal-grid{grid-template-columns:1fr}.task-modal footer{flex-wrap:wrap}.task-modal footer>span{display:none}.task-modal footer .btn{flex:1;min-width:120px}}
'''
          if '/* Jira-style task interaction */' not in s:
              css.write_text(s + extra)
          PY
      - name: Commit task board upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/styles.css
          git diff --cached --quiet || git commit -m 'Add Jira-style draggable task board'
          git push origin internal-platform
