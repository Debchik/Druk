name: Hydrate internal platform

on:
  push:
    branches: [internal-platform]
    paths:
      - '.platform-bundle/**'
      - '.github/workflows/hydrate-platform.yml'

permissions:
  contents: write

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal-platform
          fetch-depth: 0
      - name: Hydrate platform source
        shell: bash
        run: |
          set -euo pipefail
          cp assets/druk.webp /tmp/druk.webp
          cp .platform-bundle/platform.tgz /tmp/platform.tgz
          tar -tzf /tmp/platform.tgz >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/platform.tgz -C .
          mkdir -p frontend/public
          cp /tmp/druk.webp frontend/public/druk.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add internal platform source'
          git push origin internal-platform
